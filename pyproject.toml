[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-encrypted-id"
version = "0.5.0"
description = "Encrypted IDs for Django Models"
readme = "README.rst"
license = {text = "BSD"}
requires-python = ">=3.10"
authors = [
    {name = "Amit Upadhyay", email = "upadhyay@gmail.com"},
]
keywords = ["Django", "encryption", "ekey", "skey", "primary-key"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.2,<6",
    "pycryptodomex>=3.15",
]

[project.urls]
Homepage = "https://github.com/amitu/django-encrypted-id"
Repository = "https://github.com/amitu/django-encrypted-id"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
]

[tool.setuptools.packages.find]
include = ["encrypted_id*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tekey.settings"
pythonpath = ["tests"]
testpaths = ["tests"]
addopts = "-q"
